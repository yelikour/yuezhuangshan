<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>研讨会工作台</title>
  <link rel="stylesheet" href="../../ui/common.css" />
</head>
<body>
  <main class="page" id="root" hidden>
    <!-- 登录视图 (P05) -->
    <section id="loginView">
      <h1 id="welcome"></h1>
      <p class="readable" id="loginHint"></p>

      <div style="max-width:24em">
        <div class="settings-row"><label for="account">会议账号</label></div>
        <input type="text" id="account" class="input" style="width:100%" autocomplete="off" />
        <div class="settings-row" style="margin-top:0.8em"><label for="password">口令</label></div>
        <input type="password" id="password" class="input" style="width:100%" autocomplete="off" />
        <div style="display:flex; gap:0.5em; margin-top:1em; align-items:center">
          <button class="btn" id="loginBtn">登录</button>
          <button class="btn" id="hintBtn">我卡住了</button>
        </div>
        <div id="err" class="error-msg" style="margin-top:0.6em"></div>
        <div id="hintArea" style="margin-top:0.6em"></div>
      </div>
    </section>

    <!-- 记录视图 (P06) -->
    <section id="recordsView" hidden>
      <h1 id="recordsTitle"></h1>
      <p class="readable">已登录身份：研讨会受邀创作者。下方为嘉宾 <strong>沈苒</strong> 的门禁与房卡记录。</p>

      <table class="records-table" id="logsTable"></table>

      <div id="afterRead" class="readable" style="margin-top:1.5em" hidden>
        <h2>时间线对不上</h2>
        <p>沈苒在 <strong>21:03</strong> 发完"我去走廊尽头看看"就离线了（见谛听聊天记录）。</p>
        <p>但她的房卡，在 <strong>23:47</strong> 和 <strong>02:11</strong>，两次刷在了"岳圣桩·维护通道"——一个普通参会者根本不该去的地方。</p>
        <p>失联之后，还有人（或东西）带着她的房卡，往山的更深处走。</p>
        <p style="margin-top:1em"><span class="will-flicker">手机震了一下。</span>沈苒的账号——那个已经关机的账号——刚刚给你发来一条消息。</p>
        <p style="margin-top:1em"><a class="btn" href="../ending/index.html">查看消息</a></p>
      </div>
    </section>
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
