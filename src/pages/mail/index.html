<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云雁邮 · 收件箱</title>
  <link rel="stylesheet" href="../../ui/common.css" />
</head>
<body>
  <main class="page mail-page" id="root" hidden>
    <h1>云雁邮 · 收件箱</h1>
    <p class="readable" style="opacity:0.6">收件人：我（研讨会受邀创作者）</p>
    <p id="readHint" class="readable" style="opacity:0.7; font-size:0.9em; min-height:1.2em"></p>

    <div class="mail-layout">
      <!-- 左侧：邮件列表（独立滚动） -->
      <div class="mail-list-pane">
        <div class="mail-list-header">收件箱</div>
        <div class="mail-list" id="mailList"></div>
      </div>
      <!-- 右侧：邮件正文（独立滚动） -->
      <div class="mail-view-pane">
        <div id="mailView" class="readable mail-view"></div>
      </div>
    </div>
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
