<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合奘 · 归山合一</title>
  <link rel="stylesheet" href="../../ui/common.css" />
</head>
<body class="skin-hezong">
  <main class="page" id="root" hidden>
    <header class="hezong-header">
      <h1 id="brand"></h1>
      <p class="hezong-slogan" id="slogan"></p>
    </header>

    <nav class="hezong-nav" id="sectionNav"></nav>

    <article id="sectionBody" class="hezong-body readable"></article>

    <!-- 支线 B+：执礼人终端（口令谜题） -->
    <section id="innerGate" hidden style="margin:1.5em 0; padding:1em 1.2em; border:1px solid rgba(138,109,59,0.5); border-radius:6px; background:rgba(0,0,0,0.25)">
      <h2 id="innerGateTitle" style="margin-top:0"></h2>
      <p id="innerGateIntro" class="readable" style="font-size:0.9em; opacity:0.75"></p>
      <p id="innerGatePrompt" class="readable" style="font-size:0.9em"></p>
      <div style="display:flex; gap:0.5em; flex-wrap:wrap; align-items:center">
        <label for="innerGateInput" class="sr-only">口令</label>
        <input id="innerGateInput" type="text" autocomplete="off"
          style="flex:1 1 14em; min-width:12em; padding:0.5em 0.7em; background:rgba(0,0,0,0.4); color:#f0e6d2; border:1px solid rgba(138,109,59,0.6); border-radius:4px" />
        <button class="btn" id="innerGateBtn">核验</button>
        <button class="btn" id="innerHintBtn">我卡住了</button>
      </div>
      <div id="innerGateMsg" role="status" aria-live="polite" style="margin-top:0.5em; font-size:0.9em"></div>
      <div id="innerHintArea"></div>
    </section>

    <!-- 解锁后的教内文献 -->
    <section id="innerDocs" hidden style="margin:1.5em 0">
      <h2 style="margin-top:0" id="innerDocsTitle">执礼人终端</h2>
      <div id="innerDocsBody"></div>
    </section>

    <hr style="margin:2em 0; border-color:rgba(255,255,255,0.1)" />
    <p class="readable" style="opacity:0.5; font-size:0.85em">
      （本页面为合奘教义虚构资料。合奘教为完全虚构的宗教组织，不对应任何现实宗教。）
    </p>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
